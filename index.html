<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Aboudy ❤️</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Georgia", serif;
        background:
            radial-gradient(circle at center, #24121d 0%, #0d080c 45%, #050406 100%);
        color: white;
    }

    /* Luxury glow behind everything */
    body::before {
        content: "";
        position: fixed;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: rgba(255, 80, 130, 0.08);
        filter: blur(100px);
        animation: breathe 5s ease-in-out infinite;
    }

    .container {
        position: relative;
        z-index: 5;
        width: min(90%, 650px);
        padding: 60px 45px;
        text-align: center;

        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 30px;

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        box-shadow:
            0 30px 100px rgba(0, 0, 0, 0.65),
            inset 0 1px 1px rgba(255, 255, 255, 0.08);

        animation: appear 2s ease forwards;
    }

    /* Heart */
    .heart {
        position: relative;
        width: 90px;
        height: 90px;
        margin: 0 auto 45px;

        transform: rotate(-45deg);
        background: linear-gradient(135deg, #ff7aa8, #c2185b);

        filter:
            drop-shadow(0 0 15px rgba(255, 80, 140, 0.8))
            drop-shadow(0 0 45px rgba(255, 40, 110, 0.45));

        animation: heartbeat 2s ease-in-out infinite;
    }

    .heart::before,
    .heart::after {
        content: "";
        position: absolute;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: inherit;
    }

    .heart::before {
        top: -45px;
        left: 0;
    }

    .heart::after {
        left: 45px;
        top: 0;
    }

    h1 {
        position: relative;
        font-size: clamp(2.2rem, 7vw, 4rem);
        font-weight: 400;
        letter-spacing: 2px;

        background: linear-gradient(
            90deg,
            #fff,
            #ffc2d8,
            #fff
        );

        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;

        animation: shine 4s linear infinite;
    }

    .line {
        width: 70px;
        height: 1px;
        margin: 25px auto;

        background: linear-gradient(
            90deg,
            transparent,
            #ff8eb5,
            transparent
        );

        box-shadow: 0 0 15px #ff6f9f;
    }

    p {
        max-width: 500px;
        margin: auto;

        font-size: 1.15rem;
        line-height: 1.9;
        letter-spacing: 0.4px;

        color: rgba(255,255,255,0.78);
    }

    .signature {
        margin-top: 30px;
        font-size: 0.85rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: rgba(255, 180, 205, 0.55);
    }

    /* Floating particles */
    .particle {
        position: fixed;
        bottom: -20px;
        pointer-events: none;
        opacity: 0;

        animation: float linear infinite;
    }

    @keyframes heartbeat {
        0%, 100% {
            transform: rotate(-45deg) scale(1);
        }

        50% {
            transform: rotate(-45deg) scale(1.15);
        }
    }

    @keyframes breathe {
        0%, 100% {
            transform: scale(0.9);
            opacity: 0.5;
        }

        50% {
            transform: scale(1.2);
            opacity: 0.9;
        }
    }

    @keyframes shine {
        to {
            background-position: 200% center;
        }
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.96);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes float {
        0% {
            transform: translateY(0) scale(0.5) rotate(0deg);
            opacity: 0;
        }

        10% {
            opacity: 0.7;
        }

        90% {
            opacity: 0.4;
        }

        100% {
            transform: translateY(-110vh) scale(1.2) rotate(180deg);
            opacity: 0;
        }
    }

    @media (max-width: 600px) {
        .container {
            padding: 50px 25px;
        }

        p {
            font-size: 1rem;
        }

        .heart {
            width: 70px;
            height: 70px;
            margin-bottom: 40px;
        }

        .heart::before,
        .heart::after {
            width: 70px;
            height: 70px;
        }

        .heart::before {
            top: -35px;
        }

        .heart::after {
            left: 35px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="heart"></div>

    <h1>Love you Aboudy ❤️</h1>

    <div class="line"></div>

    <p>
        I truly appreciate your existence and the place
        you hold in my life. You mean more to me than
        words can explain.
    </p>

    <div class="signature">
        Always appreciate you
    </div>

</div>

<script>
    const symbols = ["♡", "♥", "✦", "·"];

    function createParticle() {
        const particle = document.createElement("div");

        particle.className = "particle";
        particle.innerHTML =
            symbols[Math.floor(Math.random() * symbols.length)];

        particle.style.left = Math.random() * 100 + "vw";
        particle.style.fontSize =
            (10 + Math.random() * 18) + "px";

        particle.style.animationDuration =
            (7 + Math.random() * 8) + "s";

        particle.style.animationDelay =
            Math.random() * 3 + "s";

        document.body.appendChild(particle);

        setTimeout(() => {
            particle.remove();
        }, 16000);
    }

    setInterval(createParticle, 450);
</script>

</body>
</html>
